<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>마감 일정</title>
<style>
/* Layout: 상단 요약(다음 최종고) → 범례 → 월별 달력(좁은 화면에선 날짜 목록) → 회차별 표 */
:root{
  --bg:#f7f8f6; --surface:#ffffff; --fg:#1d2321; --muted:#66706c; --line:#dde2df;
  --author:#b4530a; --author-bg:#fff1e3; --author-fg:#8a3d05;
  --deliver:#0f7f63; --deliver-bg:#dcf7ee; --deliver-fg:#0b5e49;
  --release:#55605c; --release-bg:#eef1ef;
  --rest-bg:#f3f0ea; --rest-fg:#8a7f6a;
  --custom:#7e57c2; --custom-bg:#efe9f8; --custom-fg:#5b3a99;
  --today:#1d2321;
  --display:Arial,"Noto Sans KR",sans-serif;
  --body:Arial,"Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141816; --surface:#1c211f; --fg:#e7ece9; --muted:#9aa5a0; --line:#2e3532;
  --author:#f59a4e; --author-bg:#3a2414; --author-fg:#ffc797;
  --deliver:#4fd6ae; --deliver-bg:#143229; --deliver-fg:#9cefd3;
  --release:#a8b2ae; --release-bg:#252b28;
  --rest-bg:#26241f; --rest-fg:#b5aa94; --custom:#b39ddb; --custom-bg:#2d2540; --custom-fg:#d7c8f5; --today:#e7ece9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141816; --surface:#1c211f; --fg:#e7ece9; --muted:#9aa5a0; --line:#2e3532;
  --author:#f59a4e; --author-bg:#3a2414; --author-fg:#ffc797;
  --deliver:#4fd6ae; --deliver-bg:#143229; --deliver-fg:#9cefd3;
  --release:#a8b2ae; --release-bg:#252b28;
  --rest-bg:#26241f; --rest-fg:#b5aa94; --custom:#b39ddb; --custom-bg:#2d2540; --custom-fg:#d7c8f5; --today:#e7ece9; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding-block:32px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-size:clamp(28px,5vw,40px);margin:0;line-height:1.2;text-wrap:balance}
.sub{color:var(--muted);margin:0}
.next{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.next .box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.next .box.main{border-color:var(--author);background:var(--author-bg)}
.next .k{font-size:12px;color:var(--muted);font-weight:600}
.next .box.main .k{color:var(--author-fg)}
.next .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.next .d{font-size:13px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.chip{display:inline-block;font-size:12px;line-height:1.35;padding:2px 6px;border-radius:5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.c-author{background:var(--author-bg);color:var(--author-fg);box-shadow:inset 3px 0 0 var(--author)}
.c-deliver{background:var(--deliver-bg);color:var(--deliver-fg)}
.c-release{background:var(--release-bg);color:var(--release);font-weight:500}
.c-custom{background:var(--custom-bg);color:var(--custom-fg);box-shadow:inset 3px 0 0 var(--custom)}
.c-rest{background:repeating-linear-gradient(135deg,var(--rest-bg) 0 6px,transparent 6px 10px);color:var(--rest-fg);font-weight:500;border:1px dashed var(--rest-fg)}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.filters button[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.filters button:focus-visible{outline:2px solid var(--author);outline-offset:2px}
.months{display:flex;flex-direction:column;gap:28px}
.month h2{font-family:var(--display);font-size:22px;margin:0 0 10px;display:flex;align-items:baseline;gap:10px}
.month h2 small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.dow{font-size:12px;font-weight:600;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.dow.sun{color:#c2412d}.dow.sat{color:#2d62c2}
.cell{min-height:92px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.cell:nth-child(7n){border-right:0}
.cell .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cell.out{background:var(--bg)}.cell.out .n{opacity:.4}
.cell.today .n{background:var(--today);color:var(--bg);border-radius:999px;padding:0 6px;align-self:flex-start;font-weight:700}
.agenda{display:none;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.agenda .row{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.agenda .row:last-child{border-bottom:0}
.agenda .row.today{background:var(--author-bg)}
.agenda .dt{font-variant-numeric:tabular-nums;font-weight:600}
.agenda .dt small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.agenda .items{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:520px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--bg)}
tr:last-child td{border-bottom:0}
td.a{color:var(--author-fg);font-weight:700}
tr.past td{opacity:.45}
section h2.sec{font-family:var(--display);font-size:22px;margin:0 0 10px}
.note{font-size:13px;color:var(--muted)}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
@media (max-width:640px){.grid{display:none}.agenda{display:flex}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <div class="eyebrow" id="eyebrow">작가님 공유용 마감 일정</div>
    <h1 id="title">마감 일정</h1>
    <p class="sub" id="sub"></p>
  </header>
  <div class="next" id="next"></div>
  <div class="legend" id="legend" aria-label="범례"></div>
  <div class="filters" id="filters" role="group" aria-label="표시할 일정"></div>
  <div class="months" id="months"></div>
  <section id="tableSec">
    <h2 class="sec">회차별 일정</h2>
    <div class="table-wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
  </section>
  <p class="note" id="note"></p>
</div>
<script>
// 공유 링크(#d=...)에 담긴 일정만 보여주는 읽기 전용 페이지. 로그인·저장 없음.
const T={a:'author',d:'deliver',r:'release',h:'rest',c:'custom'};
const NAMES_ALL={author:'작가 최종고',deliver:'플랫폼 전달',release:'연재일',rest:'휴재',custom:'기타 일정'};
const LEG={author:'<span class="chip c-author">✍ 최종고</span> 작가님 최종고 마감',deliver:'<span class="chip c-deliver">전달</span> 플랫폼 전달 마감',release:'<span class="chip c-release">연재</span> 연재(공개)일',rest:'<span class="chip c-rest">휴재</span> 휴재 주',custom:'<span class="chip c-custom">일정</span> 기타 일정'};
const ORDER={author:0,custom:1,deliver:2,release:3,rest:4};
const DOW=['일','월','화','수','목','금','토'];
const pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const fmt=s=>{const d=parse(s);return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`;};
const fmtLong=s=>{const d=parse(s);return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=key(new Date());

function decode(){
  const m=location.hash.match(/[#&]d=([^&]+)/); if(!m) return null;
  try{let b=m[1].replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';return JSON.parse(decodeURIComponent(escape(atob(b))));}catch(e){return null;}
}
function decodeShort(){
  const m=location.hash.match(/[#&]s=(.+)$/); if(!m) return null;
  try{
    const parts=m[1].split('.'); if(parts[0]!=='2') return null;
    const D0=Date.UTC(2020,0,1), kd=n=>{const d=new Date(D0+n*864e5);return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;};
    const at=kd(parseInt(parts[1],36)), b=kd(parseInt(parts[2],36)), k=+parts[3];
    const nums=str=>{const out=[];let i=0;while(i<str.length){let sg=1;if(str[i]==='-'){sg=-1;i++;}let v;if(str[i]==='~'){v=parseInt(str.substr(i+1,2),36);i+=3;}else if(str[i]==='!'){v=parseInt(str.substr(i+1,4),36);i+=5;}else{v=parseInt(str[i],36);i++;}out.push(sg*v);}return out;};
    const e=[];
    for(let g=0;g<k;g++){
      const grp=parts[4+g], t=grp[0], [head,body]=grp.slice(1).split('_');
      const ep0=head?+head:null; let off=0;
      nums(body).forEach((v,i)=>{off=i?off+v:v;e.push([t,ep0===null?null:ep0+i,off]);});
    }
    const n=decodeURIComponent(parts.slice(4+k).join('.'));
    return {v:2,n,at,b,e};
  }catch(err){return null;}
}
// 짧은 링크(s#번호): 공유용 일정을 Firebase에서 읽어옴 (읽기 전용, 로그인 불필요)
async function loadRemote(){
  const m=location.hash.match(/^#([A-Za-z0-9]{5,12})$/); if(!m) return null;
  document.getElementById('title').textContent='일정을 불러오는 중…';
  try{
    const r=await fetch(`https://firestore.googleapis.com/v1/projects/webtoon-pd-calendar/databases/(default)/documents/shares/${m[1]}?key=AIzaSyA_W6zLhHmplxu5rkaTFMGRNdM7GLPnSEA`);
    if(!r.ok) return null;
    const j=await r.json(); return JSON.parse(j.fields.data.stringValue);
  }catch(e){return null;}
}
(async()=>{
const D=decodeShort()||decode()||await loadRemote();
if(!D){
  document.getElementById('app').innerHTML='<div class="empty"><h1>일정을 불러올 수 없어요</h1><p>공유받은 링크 전체가 복사되었는지 확인해 주세요.</p></div>';
}else{
  const base=parse(D.b);
  const EV=D.e.map(([t,ep,off])=>{const d=new Date(base);d.setDate(base.getDate()+off);return t==='c'?{t:'custom',ep:null,title:(D.c||[])[ep]||'일정',d:key(d)}:{t:T[t],ep:ep||null,d:key(d)};});
  const TYPES=Object.keys(NAMES_ALL).filter(t=>EV.some(e=>e.t===t));
  const show={};TYPES.forEach(t=>show[t]=true);
  const SK='shareShow:'+D.n;
  try{const s=JSON.parse(localStorage.getItem(SK));if(s)TYPES.forEach(t=>{if(t in s)show[t]=s[t];});}catch(e){}
  document.title=`${D.n} 마감 일정`;
  document.getElementById('title').textContent=`${D.n} 마감 일정`;
  const eps=[...new Set(EV.filter(e=>e.ep).map(e=>e.ep))].sort((a,b)=>a-b);
  document.getElementById('eyebrow').textContent=`작가님 공유용${eps.length?` · ${eps[0]}~${eps[eps.length-1]}화`:''}`;
  document.getElementById('sub').textContent=TYPES.map(t=>NAMES_ALL[t]).join(', ')+'을(를) 한눈에 볼 수 있게 정리했어요.';
  document.getElementById('note').textContent=D.v===1&&/^#[A-Za-z0-9]{5,12}$/.test(location.hash)?`일정이 바뀌면 이 링크에 자동으로 반영돼요. 새로고침하면 최신 일정을 볼 수 있어요. (마지막 업데이트 ${fmtLong(D.at)})`:`${fmtLong(D.at)} 기준 일정이에요. 일정이 바뀌면 새 링크로 다시 보내드릴게요.`;
  document.getElementById('legend').innerHTML=TYPES.map(t=>`<span>${LEG[t]}</span>`).join('');

  const chipText=e=>e.t==='custom'?esc(e.title):e.t==='rest'?'휴재':`${e.t==='author'?'✍ ':''}${e.ep}화 ${e.t==='author'?'최종고':e.t==='deliver'?'전달':'연재'}`;
  const chip=e=>`<span class="chip c-${e.t}" title="${e.t==='custom'?esc(e.title):(e.ep?e.ep+'화 ':'')+NAMES_ALL[e.t]}">${chipText(e)}</span>`;

  function renderNext(){
    const up=t=>EV.filter(e=>e.t===t&&e.d>=today).sort((a,b)=>a.d<b.d?-1:1)[0];
    const last=t=>EV.filter(e=>e.t===t).sort((a,b)=>a.d<b.d?1:-1)[0];
    const dd=s=>{const n=Math.round((parse(s)-parse(today))/864e5);return n===0?'오늘':`D-${n}`;};
    let h='';
    if(TYPES.includes('author')){const a=up('author');h+=a?`<div class="box main"><span class="k">다음 최종고 마감</span><span class="v">${a.ep}화 · ${fmt(a.d)}</span><span class="d">${dd(a.d)}</span></div>`:`<div class="box main"><span class="k">최종고 마감</span><span class="v">모두 지났어요</span></div>`;}
    if(TYPES.includes('release')){const r=up('release');if(r)h+=`<div class="box"><span class="k">다음 연재</span><span class="v">${r.ep}화 · ${fmt(r.d)}</span><span class="d">${dd(r.d)}</span></div>`;}
    if(TYPES.includes('author')){const l=last('author');const lr=last('release');h+=`<div class="box"><span class="k">마지막 최종고</span><span class="v">${l.ep}화 · ${fmt(l.d)}</span>${lr?`<span class="d">${lr.ep}화 연재 ${fmt(lr.d)}</span>`:''}</div>`;}
    document.getElementById('next').innerHTML=h;
  }
  function renderFilters(){
    const f=document.getElementById('filters');
    if(TYPES.length<2){f.hidden=true;return;}
    f.innerHTML=TYPES.map(t=>`<button type="button" id="f-${t}" data-t="${t}" aria-pressed="${show[t]}">${NAMES_ALL[t]}</button>`).join('');
    f.querySelectorAll('button').forEach(b=>b.onclick=()=>{show[b.dataset.t]=!show[b.dataset.t];try{localStorage.setItem(SK,JSON.stringify(show));}catch(e){}renderFilters();renderMonths();});
  }
  function renderMonths(){
    const map={};
    EV.filter(e=>show[e.t]).forEach(e=>(map[e.d]??=[]).push(e));
    Object.values(map).forEach(a=>a.sort((x,y)=>ORDER[x.t]-ORDER[y.t]));
    const all=EV.map(e=>e.d).sort(); if(!all.length){document.getElementById('months').innerHTML='';return;}
    const now=parse(today);
    let first=parse(all[0]); const last=parse(all[all.length-1]);
    if(first<now&&now<=last) first=now; // 지난 달은 생략
    let html='';
    for(let m=new Date(first.getFullYear(),first.getMonth(),1);m<=last;m=new Date(m.getFullYear(),m.getMonth()+1,1)){
      const y=m.getFullYear(),mo=m.getMonth();
      const inM=k=>{const d=parse(k);return d.getFullYear()===y&&d.getMonth()===mo;};
      const days=Object.keys(map).filter(inM).sort();
      const nA=EV.filter(e=>e.t==='author'&&inM(e.d)).length;
      let grid=DOW.map((d,i)=>`<div class="dow${i===0?' sun':i===6?' sat':''}">${d}</div>`).join('');
      const lead=new Date(y,mo,1).getDay(), start=new Date(y,mo,1-lead), cells=Math.ceil((new Date(y,mo+1,0).getDate()+lead)/7)*7;
      for(let i=0;i<cells;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=key(d);const out=d.getMonth()!==mo;
        grid+=`<div class="cell${out?' out':''}${k===today?' today':''}"><span class="n">${d.getDate()}</span>${out?'':(map[k]||[]).map(chip).join('')}</div>`;}
      const agenda=days.length?days.map(k=>{const d=parse(k);return `<div class="row${k===today?' today':''}"><div class="dt">${d.getMonth()+1}/${d.getDate()}<small>${DOW[d.getDay()]}요일</small></div><div class="items">${map[k].map(chip).join('')}</div></div>`;}).join(''):`<div class="row"><div class="dt">—</div><div class="items note">이 달에는 일정이 없어요</div></div>`;
      const sm=TYPES.includes('author')?`<small>${nA?`최종고 ${nA}회`:'최종고 없음'}</small>`:'';
      html+=`<section class="month"><h2>${y}년 ${mo+1}월 ${sm}</h2><div class="grid">${grid}</div><div class="agenda">${agenda}</div></section>`;
    }
    document.getElementById('months').innerHTML=html;
  }
  function renderTable(){
    const cols=TYPES.filter(t=>t!=='rest'&&t!=='custom');
    if(!eps.length||!cols.length){document.getElementById('tableSec').hidden=true;return;}
    document.getElementById('thead').innerHTML=`<tr><th>회차</th>${cols.map(t=>`<th>${NAMES_ALL[t]}</th>`).join('')}</tr>`;
    const get=(t,ep)=>EV.find(e=>e.t===t&&e.ep===ep);
    document.getElementById('tbody').innerHTML=eps.map(ep=>{
      const ds=cols.map(t=>get(t,ep)?.d).filter(Boolean).sort();
      const past=ds.length&&ds[ds.length-1]<today;
      return `<tr class="${past?'past':''}"><td>${ep}화</td>${cols.map(t=>{const e=get(t,ep);return `<td${t==='author'?' class="a"':''}>${e?fmt(e.d):'—'}</td>`;}).join('')}</tr>`;
    }).join('');
  }
  renderNext();renderFilters();renderMonths();renderTable();
}
})();
</script>
</body>
</html>
